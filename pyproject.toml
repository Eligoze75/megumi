[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "megumi"
version = "0.1.0"
description = "A feature selection toolkit for ML practitioners — visualize relationships, rank feature importance, and understand model contributions. Choose wisely."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["megumi"]
