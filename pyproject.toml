[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "megumi"
version = "0.1.1"
description = "A feature selection toolkit for ML practitioners: visualize relationships, rank feature importance, and understand feature contributions. Choose wisely."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Eli Gonzalez" },
]
keywords = ["feature selection", "machine learning", "shap", "visualization", "exploratory data analysis", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "shap>=0.44",
]

[project.urls]
Homepage = "https://github.com/Eligoze75/megumi"
LinkedIn = "https://www.linkedin.com/in/el%C3%AD-gonz%C3%A1lez-zequeida/"
Medium = "https://medium.com/@eligoze75"
"Bug Tracker" = "https://github.com/Eligoze75/megumi/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["megumi"]
